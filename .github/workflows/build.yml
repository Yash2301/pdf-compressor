name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset: PDFCompressor-windows.exe
          - os: macos-latest
            asset: PDFCompressor-mac.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pyinstaller --noconfirm --onefile --windowed --name PDFCompressor app.py
        if: runner.os == 'Windows'
      - run: move dist\PDFCompressor.exe ${{ matrix.asset }}
        if: runner.os == 'Windows'
        shell: cmd
      - run: |
          pyinstaller --noconfirm --windowed --name PDFCompressor app.py
          ditto -c -k --keepParent dist/PDFCompressor.app ${{ matrix.asset }}
        if: runner.os == 'macOS'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            PDFCompressor-windows.exe
            PDFCompressor-mac.zip
          generate_release_notes: true
